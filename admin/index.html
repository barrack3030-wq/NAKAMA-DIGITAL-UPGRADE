<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nakama Digital CMS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#0b1220;color:#eef4ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.card{background:#121c2e;border:1px solid #26344c;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;color:#a9b6ca;margin-bottom:7px}input,button{font:inherit}input[type=text],input[type=url],input[type=number],input[type=password]{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #32435f;background:#0d1626;color:#fff;box-sizing:border-box}input[type=file]{width:100%;color:#cbd5e1}button{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}.primary{background:#2563eb;color:#fff}.ghost{background:#1c2a40;color:#dbe7ff}.danger{background:#4a1d27;color:#ffd7df}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#97a6bc;font-size:13px}.preview{max-width:220px;max-height:100px;object-fit:contain;background:#fff;border-radius:10px;padding:8px}.item{border:1px solid #283852;border-radius:14px;padding:16px;margin:14px 0}.thumb{width:180px;height:110px;background:#eef4ff;border-radius:10px;object-fit:cover}.status{margin:10px 0;color:#9fc1ff;min-height:20px}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.head{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><div class="wrap"><div class="head"><div><h1 style="margin:0">Nakama Digital CMS</h1><div class="muted">Static GitHub Pages CMS</div></div><a href="../" style="color:#9fc1ff">Visit site ↗</a></div><div class="card"><h2>GitHub connection</h2><p class="muted">Use a fine-grained GitHub token with Contents: Read and Write for this repository. Token is kept only in this browser session.</p><div class="row"><input id="token" type="password" placeholder="GitHub token" style="flex:1;min-width:240px"><button class="primary" onclick="loadAll()">Load current data</button></div><div id="status" class="status"></div></div><div class="card"><h2>Logo</h2><div class="grid"><div><label>Brand name</label><input id="brand" type="text"><label style="margin-top:14px">Logo path</label><input id="logoPath" type="text"><label style="margin-top:14px">Logo width (px)</label><input id="logoWidth" type="number" min="50" max="320"></div><div><label>Upload logo</label><input id="logoFile" type="file" accept="image/svg+xml,image/png,image/jpeg,image/webp" onchange="uploadLogo()"><p class="muted">Recommended SVG or transparent PNG.</p><img id="logoPreview" class="preview" alt="Logo preview"></div></div><div class="row" style="margin-top:16px"><button class="primary" onclick="saveSite()">Save logo settings</button></div></div><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Portfolio</h2><button class="primary" onclick="addItem()">+ Add portfolio</button></div><div id="portfolio"></div><button class="primary" onclick="savePortfolio()">Save portfolio</button></div></div><script>const OWNER='barrack3030-wq',REPO='NAKAMA-DIGITAL-UPGRADE',BRANCH='main';let site={brandName:'Nakama Digital',logoPath:'assets/logo/logo.svg',logoWidth:150},items=[];let shas={};const $=id=>document.getElementById(id);const raw=p=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${p}`;function tok(){return $('token').value||sessionStorage.getItem('nakama_github_token')||''}function msg(t){$('status').textContent=t}function headers(){return{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'}}async function gh(path){let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,{headers:headers()});if(!r.ok)throw Error(await r.text());let j=await r.json();shas[path]=j.sha;return JSON.parse(atob(j.content.replace(/\n/g,'')))}async function put(path,data,sha,message){let content=btoa(unescape(encodeURIComponent(data)));let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',headers:headers(),body:JSON.stringify({message,content,sha,branch:BRANCH})});if(!r.ok)throw Error(await r.text());let j=await r.json();shas[path]=j.content.sha}async function upload(path,file,message){let data=await file.arrayBuffer(),bytes=new Uint8Array(data),bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',headers:headers(),body:JSON.stringify({message,content:btoa(bin),branch:BRANCH})});if(!r.ok)throw Error(await r.text());let j=await r.json();shas[path]=j.content.sha}async function loadAll(){try{let t=tok();if(!t)throw Error('Masukkan GitHub token.');sessionStorage.setItem('nakama_github_token',t);site=await gh('data/site.json');items=await gh('data/portfolio.json');$('brand').value=site.brandName||'';$('logoPath').value=site.logoPath||'';$('logoWidth').value=site.logoWidth||150;$('logoPreview').src=raw(site.logoPath||'assets/logo/logo.svg')+'?'+Date.now();render();msg('Data berhasil dimuat.')}catch(e){msg('Error: '+e.message)}}function render(){let root=$('portfolio');root.innerHTML='';items.forEach((x,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="grid"><div><label>Title Indonesia</label><input data-k="titleId" value="${A(x.titleId)}"><label>Title English</label><input data-k="titleEn" value="${A(x.titleEn)}"><label>Category Indonesia</label><input data-k="categoryId" value="${A(x.categoryId)}"><label>Category English</label><input data-k="categoryEn" value="${A(x.categoryEn)}"><label>External URL</label><input data-k="link" type="url" value="${A(x.link)}"><label>Image path</label><input data-k="image" value="${A(x.image)}"></div><div><label>Upload image</label><input type="file" accept="image/*" onchange="uploadItemImage(${i},this)"><div style="margin-top:12px">${x.image?`<img class="thumb" src="${A(x.image+'?'+Date.now())}" alt="">`:''}</div><div class="row" style="margin-top:14px"><button class="danger" onclick="items.splice(${i},1);render()">Remove</button></div></div></div>`;d.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{x[inp.dataset.k]=inp.value});root.appendChild(d)})}function A(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function addItem(){items.push({id:'portfolio-'+Date.now(),titleId:'New Project',titleEn:'New Project',categoryId:'Website',categoryEn:'Website',image:'',link:''});render()}async function saveSite(){try{site={brandName:$('brand').value.trim()||'Nakama Digital',logoPath:$('logoPath').value.trim()||'assets/logo/logo.svg',logoWidth:Math.max(50,Math.min(320,Number($('logoWidth').value)||150))};await put('data/site.json',JSON.stringify(site,null,2),shas['data/site.json'],'Update site settings from CMS');msg('Logo settings saved.')}catch(e){msg('Error: '+e.message)}}async function savePortfolio(){try{await put('data/portfolio.json',JSON.stringify(items,null,2),''+shas['data/portfolio.json'],'Update portfolio from CMS');msg('Portfolio saved.')}catch(e){msg('Error: '+e.message)}}async function uploadLogo(){try{let f=$('logoFile').files[0];if(!f)return;let ext=f.name.split('.').pop().toLowerCase();let path='assets/logo/logo.'+ext;await upload(path,f,'Upload logo from CMS');$('logoPath').value=path;$('logoPreview').src=raw(path)+'?'+Date.now();site.logoPath=path;msg('Logo uploaded. Click Save logo settings.')}catch(e){msg('Upload error: '+e.message)}}async function uploadItemImage(i,input){try{let f=input.files[0];if(!f)return;let ext=f.name.split('.').pop().toLowerCase();let safe=f.name.toLowerCase().replace(/[^a-z0-9.-]+/g,'-');let path='assets/portfolio/'+Date.now()+'-'+safe;await upload(path,f,'Upload portfolio image from CMS');items[i].image=path;render();msg('Portfolio image uploaded. Click Save portfolio.')}catch(e){msg('Upload error: '+e.message)}}$('token').value=sessionStorage.getItem('nakama_github_token')||'';loadAll();</script></body></html>
