name: Deploy React site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://efgstmzapyytidkhkxfh.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9lub8q-JZm7sUMcBLGFRyw_KMFrrj4Q

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Prepare transparent PNG logo
        run: |
          mkdir -p public/images/logo
          convert public/images/logo/logo.png \
            -alpha on \
            -fuzz 8% \
            -fill none \
            -draw "matte 0,0 floodfill" \
            -trim +repage \
            public/images/logo/logo-web.png
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
